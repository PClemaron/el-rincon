<!DOCTYPE html>
<html lang="{{ page.lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{{ page.title }} | El Rincon</title>

  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>

<body>

<header>

  {% include site-header.html %}

  <h1>{{ page.heading }}</h1>

  <p class="subtitle">
    {{ page.location }}
  </p>

  {% if page.version %}
  <p class="version">
    {{ page.version }}
  </p>
  {% endif %}

</header>

<main>

  {{ content }}

</main>

{% include site-footer.html %}

</body>
</html>
